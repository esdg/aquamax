[platformio]
default_envs = simulation
extra_configs = platformio.local.ini

[env:simulation]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
extra_scripts = pre:tools/generate_icons.py
build_unflags = -std=gnu++11
build_flags =
	-std=gnu++17
	-DBOARD_HAS_PSRAM
	-DAQUAMAX_SIMULATION=1
monitor_speed = 115200
lib_deps =
	paulstoffregen/OneWire@2.3.8

[env:temperature_probe]
extends = env:simulation
build_flags =
	${env:simulation.build_flags}
	-DAQUAMAX_TEMPERATURE_PROBE=1

[env:adc_probe]
extends = env:simulation
build_flags =
	${env:simulation.build_flags}
	-DAQUAMAX_ADC_PROBE=1

[env:web_preview]
extends = env:simulation
build_flags =
	${env:simulation.build_flags}
	-DAQUAMAX_WEB_PREVIEW=1
lib_deps =
	${env:simulation.lib_deps}
	links2004/WebSockets@2.7.1

[env:web_tft]
extends = env:web_preview
build_flags =
	${env:web_preview.build_flags}
	-DAQUAMAX_TFT=1
lib_deps =
	${env:web_preview.lib_deps}
	lovyan03/LovyanGFX@1.2.7

[env:web_tft_ph_probe]
extends = env:web_tft
build_flags =
	${env:web_tft.build_flags}
	-DAQUAMAX_PH_PROBE=1

[env:native]
platform = native@1.2.1
build_flags = -std=c++17 -Itest/support
test_framework = unity
test_build_src = yes
build_src_filter = +<sensors/> +<calibration/> +<alerts/> +<events/> +<display/> +<hardware/TemperatureProbe.cpp> +<hardware/Ads1115.cpp> +<settings/Settings.cpp> +<settings/SettingsStore.cpp> +<settings/PhCalibrationStore.cpp> +<settings/TemperatureCalibrationStore.cpp> +<settings/AlertSettingsStore.cpp> -<main.cpp>